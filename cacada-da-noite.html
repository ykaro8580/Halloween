<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caça da Noite</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0508;--panel:#150b10;--line:#3a2229;--ink:#ece3d0;--dim:#a89a8a;--blood:#c0243b;--acc:#c0243b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 60px #000;z-index:30}
h1,h2,h3,summary,.main{font-family:'Pirata One',Georgia,serif;font-weight:400;letter-spacing:.5px;margin:0 0 6px}
h1{font-size:54px;line-height:1;text-shadow:0 0 18px var(--blood)}h2{font-size:32px}h3{font-size:24px}
.fog{position:fixed;inset:-10%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 85%,rgba(160,30,50,.28),transparent 55%),radial-gradient(ellipse at 85% 50%,rgba(130,130,150,.12),transparent 50%);animation:drift 28s ease-in-out infinite alternate}
.fog.b{background:radial-gradient(ellipse at 70% 90%,rgba(120,20,40,.25),transparent 50%);animation-duration:40s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(7%,-4%) scale(1.12)}}
.em{position:fixed;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#e0503a;opacity:0;pointer-events:none;z-index:1;animation:rise 11s linear infinite}
@keyframes rise{10%{opacity:.8}to{transform:translate(40px,-105vh);opacity:0}}
#app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:12px}
#hud{position:sticky;top:0;z-index:20}
.panel{position:relative;background:linear-gradient(#170c11,#0f080b);border:1px solid var(--line);border-left:3px solid var(--acc);box-shadow:inset 0 0 40px #000;padding:14px;margin-bottom:12px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,transparent 0 23px,#6d0f1e 23px 25px,transparent 25px 71px,#8a1428 71px 74px,transparent 74px 130px);opacity:.7}
.dim,small{color:var(--dim)}small{font-size:14px}
.btn{font:inherit;min-height:44px;background:#241319;color:var(--ink);border:1px solid var(--line);padding:9px 12px;cursor:pointer;text-align:left;width:100%;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--acc);background:#33171f;box-shadow:0 0 12px -2px var(--acc)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.main{background:var(--blood);border-color:var(--blood);color:#fff;font-size:26px;text-align:center;margin-top:8px}
.btn.sel{border-color:var(--ink);background:#431b27;box-shadow:0 0 16px -2px var(--acc),inset 0 0 14px #000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
input{font:inherit;background:#120a0e;color:var(--ink);border:1px solid var(--line);padding:10px;width:100%;margin-top:4px}
.bar{height:11px;background:#2a1a20;margin:3px 0;border:1px solid #000}.bar i{display:block;height:100%;transition:width .35s,background .35s}
.hp i{background:linear-gradient(#e0364d,#8a1428)}.en i{background:linear-gradient(#5b92d8,#2c5190)}.xp i{background:#8a7a3a}.xp{height:4px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:15px;margin:0;background:#0d0609f2}
.hud .row{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
#snd{position:fixed;right:10px;bottom:10px;z-index:35;width:48px;min-height:48px;text-align:center;border-radius:50%;padding:0;font-size:20px}
.stat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:8px}.ctl .btn{width:46px;padding:0;text-align:center;font-size:24px}.ctl b{min-width:34px;text-align:center;font:34px 'Pirata One',Georgia,serif;color:#fff;text-shadow:0 0 10px var(--blood)}
.pips{display:flex;gap:5px;margin:8px 0}.pips i{flex:1;height:8px;background:#2a1a20}.pips i.on{background:var(--blood)}.pips i.bossp{outline:1px solid var(--ink)}
.scn{position:relative;height:min(46vh,310px);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#000;box-shadow:inset 0 0 70px #000}
.scn svg{position:absolute;inset:0;width:100%;height:100%}
.scn::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(150,10,30,calc(var(--rd,0)*.03));box-shadow:inset 0 0 90px #000}
.sf{position:absolute;inset:-20% -30%;pointer-events:none;background:radial-gradient(ellipse at 30% 70%,rgba(190,50,70,.3),transparent 50%),radial-gradient(ellipse at 75% 80%,rgba(160,160,180,.16),transparent 45%);animation:drift 18s ease-in-out infinite alternate}
.sf.s2{animation-duration:30s;animation-direction:alternate-reverse;opacity:.7}
.clear .sf{animation:none;opacity:0;transition:opacity 4s}
.ttl{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:3;padding:0 14px;text-shadow:0 2px 6px #000}
.fl{animation:fl 2.6s infinite}.wn{animation:fl 5s infinite}.ey{filter:drop-shadow(0 0 5px currentColor);animation:ey 4s infinite}.bl{animation:ey 3s infinite}
@keyframes fl{0%,100%{opacity:.55}20%{opacity:.2}30%{opacity:.7}60%{opacity:.35}80%{opacity:.65}}
@keyframes ey{0%,92%,100%{opacity:1}95%{opacity:0}}
.sh{animation:pass 9s linear infinite}@keyframes pass{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
.en{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.5s ease-in-out infinite,appear 1s both}
@keyframes breathe{50%{transform:scale(1.02,1.03)}}@keyframes appear{from{opacity:0;transform:translateY(20px)}}
.hit .en{animation:hit .4s}.lunge .en{animation:lunge .5s}.hit.lunge .en{animation:hit .4s,lunge .5s .4s}
@keyframes hit{25%{transform:translateX(-12px);filter:brightness(3) sepia(1) saturate(6)}75%{transform:translateX(10px)}}
@keyframes lunge{40%{transform:scale(1.18)}}
.pop{position:absolute;top:38%;z-index:4;font:34px 'Pirata One',Georgia,serif;color:#fff;text-shadow:0 0 8px #000,0 0 12px var(--blood);animation:pop 1.2s forwards;pointer-events:none}
.pop.g{color:#9ccf7a}.pop.p{color:#ff6b7e}@keyframes pop{to{transform:translateY(-70px);opacity:0}}
.bd{width:6px;height:6px;border-radius:50%;background:#8a1428;position:absolute;top:0;animation:drip 3s infinite}@keyframes drip{to{transform:translateY(300px)}}
#lg{height:170px;overflow:auto;font-size:15px;color:var(--dim)}#lg p{margin:3px 0}#lg .g{color:#9ccf7a}#lg .r{color:#ff7a8a}#lg .x{color:#c09ae6}#lg .e{color:#e6d596}#lg b{color:var(--ink);font-weight:400}
.card{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}.ic{font-size:30px;text-align:center}
details{margin-top:8px}summary{cursor:pointer;font-size:26px}.sep{height:6px}
.fade{animation:fade .6s}@keyframes fade{from{opacity:0;filter:brightness(0)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}#fx.f{animation:flf .45s}@keyframes flf{from{opacity:1}to{opacity:0}}
#scare{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#scare.on{display:flex}#scare::before{content:"";position:absolute;inset:0;opacity:.14;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:nz .2s steps(3) infinite}@keyframes nz{to{transform:translateY(6px)}}
#scare .face{width:min(95vw,62vh);height:auto;animation:boo .7s cubic-bezier(.1,.9,.2,1)}
@keyframes boo{0%{transform:scale(.05);filter:brightness(6)}55%{transform:scale(1.3) rotate(-4deg);filter:brightness(2)}100%{transform:scale(1)}}
#scare .ui{opacity:0;animation:in .8s 1.1s forwards;max-width:380px;position:relative}@keyframes in{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#scare .ui{opacity:1}}
</style>
</head>

corte:{n:'Corte Direto',k:'phys',type:'cort',p:1,cd:0},talho:{n:'Talho Sangrento',k:'phys',type:'cort',p:1.1,cd:2,fx:['bleed'],pr:60},duplo:{n:'Golpe Duplo',k:'phys',type:'cort',p:.7,hits:2,cd:2,pr:70},
chicote:{n:'Chicotada',k:'phys',type:'cont',p:1,cd:0},laco:{n:'Laço Esmagador',k:'phys',type:'cont',p:.9,cd:3,fx:['stun'],pr:70},impacto:{n:'Impacto Brutal',k:'phys',type:'cont',p:1.9,cd:3,pr:80},
sangria:{n:'Sangria',k:'mag',el:'sangue',p:1.2,cost:8,steal:.5},hemo:{n:'Hemorragia',k:'mag',el:'sangue',p:1,cost:14,steal:.5,fx:['bleed'],pr:90},banquete:{n:'Banquete Rubro',k:'mag',el:'sangue',p:2.2,cost:22,steal:.6,pr:150},
espinhos:{n:'Espinhos',k:'mag',el:'natureza',p:1.2,cost:8},veneno:{n:'Veneno',k:'mag',el:'natureza',p:.8,cost:10,fx:['poison'],pr:70},tempestade:{n:'Tempestade de Raízes',k:'mag',el:'natureza',p:2.2,cost:22,pr:150},
trevas:{n:'Lâmina de Trevas',k:'mag',el:'sombra',p:1.2,cost:8},pavor:{n:'Pavor',k:'mag',el:'sombra',p:.8,cost:10,fx:['weak'],pr:70},eclipse:{n:'Eclipse',k:'mag',el:'sombra',p:2.2,cost:22,pr:150},

const WP={
pistola:{n:'Pistola Velha',type:'perf',req:1,atk:6},espada:{n:'Espada Enferrujada',type:'cort',req:1,atk:6},chicote:{n:'Chicote de Couro',type:'cont',req:1,atk:6},
revolver:{n:'Revólver Prateado',type:'perf',req:3,atk:12,pr:90},sabre:{n:'Sabre de Caçador',type:'cort',req:3,atk:12,pr:90},correntes:{n:'Chicote de Correntes',type:'cont',req:3,atk:12,pr:90},
rifle:{n:'Rifle Abençoado',type:'perf',req:6,atk:20,pr:220},katana:{n:'Lâmina Carmesim',type:'cort',req:6,atk:20,pr:220},mangual:{n:'Mangual de Ferro',type:'cont',req:6,atk:20,pr:220}};
const WS={pistola:'tiro',espada:'corte',chicote:'chicote'};
const IT={pot:{n:'Poção de Vida',d:'Cura 40 HP',pr:25,i:'🧪'},grande:{n:'Grande Poção',d:'Cura 100 HP',pr:60,i:'⚗️'},ener:{n:'Elixir de Energia',d:'+20 Energia',pr:25,i:'💧'},furia:{n:'Tônico de Fúria',d:'+40% de dano por 3 turnos',pr:35,i:'🔥'},po:{n:'Pó Cegante',d:'Inimigo erra 40% por 3 turnos',pr:30,i:'🌫️'}};
// f = figura:modificadores, s = cenário
const E1={zumbi:{n:'Zumbi Operário',i:'🧟',el:'sangue',ty:'cont',hp:40,atk:7,spd:2,f:'hum:hunch',s:'ind'},ladrao:{n:'Ladrão de Corpos',i:'🦹',el:'sombra',ty:'perf',hp:32,atk:8,spd:4,f:'hum:hood,knife',s:'beco'},cao:{n:'Cão Carniçal',i:'🐕',el:'natureza',ty:'cort',hp:30,atk:8,spd:5,f:'dog',s:'flor'},vigia:{n:'Sombra Vigilante da Noite',i:'👤',el:'sombra',ty:'cont',hp:38,atk:7,spd:3,f:'shade',s:'corr'},cultista:{n:'Cultista do Sangue Açoitado',i:'🎭',el:'sangue',ty:'cort',hp:34,atk:9,spd:3,f:'hum:hood,knife',s:'rit'},atirador:{n:'Atirador da Névoa',i:'🪖',el:'pureza',ty:'perf',hp:30,atk:10,spd:3,f:'hum:hat,gun',s:'rua'}};
const E1D=[{n:'Rato de Esgoto Mutante',i:'🐀',el:'natureza',ty:'perf',hp:34,atk:8,spd:4,f:'rat',s:'esg'},{n:'Inquilino Deformado',i:'🧍',el:'sangue',ty:'cont',hp:48,atk:8,spd:2,f:'hum:hunch',s:'casa'},{n:'Gárgula de Vidro Quebrado',i:'🗿',el:'pureza',ty:'cort',hp:40,atk:9,spd:3,f:'garg',s:'torre'},{n:'Fantasma do Enforcado',i:'👻',el:'sombra',ty:'cont',hp:36,atk:9,spd:4,f:'ghost',s:'cem'},{n:'Boneca de Cera Possuída',i:'🪆',el:'pureza',ty:'perf',hp:34,atk:10,spd:3,f:'doll',s:'quarto'}];
const BOSS={madame:{n:'Madame Blackwood, a Senhora das Velas',i:'🕯️',el:'sombra',ty:'perf',hp:170,atk:12,spd:3,boss:'madame',gold:110,xp:40,f:'doll:big',s:'salao'},jack:{n:'Jack, o Decepador de Sangue',i:'🎩',el:'sangue',ty:'cort',hp:260,atk:14,spd:5,boss:'jack',gold:200,xp:80,f:'hum:hat,beak,knife',s:'jack'}};
function mk(d,f){const o={...d};o.hp=o.max=Math.round(d.hp*f);o.atk=d.atk*(1+(f-1)*.7);o.st={bleed:0,poison:0,weak:0,slow:0,stun:0};o.t=0;o.shield=0;o.fog=0;o.gold=d.gold||Math.round(8*f+rnd(8));o.xp=d.xp||Math.round(9*f);return o}
// ---------- ESTADO ----------
let P=null,G,C,D,M,view,best=0,vk='';const LOG=[];
const newC0=()=>({name:'',weapon:'espada',el:'sangue',vida:1,forca:1,vel:1,energia:1,pts:6});
let C0=newC0();
const S={on:true};try{best=+localStorage.getItem('cdn_best')||0;S.on=localStorage.getItem('cdn_snd')!=='0'}catch(e){}
const hpMax=(T=P)=>40+T.vida*12,enMax=(T=P)=>16+T.energia*6,xpN=()=>P.lvl*12+8,dodge=(T=P)=>Math.min(.4,T.vel*.03),W=()=>WP[P.weapon];
const ST={vida:['Vida',T=>`HP máximo: ${hpMax(T)}`],forca:['Força',T=>`Dano físico +${T.forca*2}, armas até Força ${T.forca}`],vel:['Velocidade',T=>`Esquiva ${Math.round(dodge(T)*100)}%, iniciativa ${T.vel}`],energia:['Energia',T=>`Energia máx. ${enMax(T)}, magia +${T.energia*2}`]};
const B=(l,a,v='',c='',d=false)=>`<button class="btn ${c}" data-a="${a}" data-v="${v}"${d?' disabled':''}>${l}</button>`;
const SP='<div class="sep"></div>';
const saveBest=()=>{try{best=Math.max(best,G.adv);localStorage.setItem('cdn_best',best)}catch(e){}};
// ---------- SOM (Web Audio procedural) ----------
let AC;const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
function tn(f,d=.1,t='square',v=.05,f2=f,dl=0){if(!S.on)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),T=a.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,T);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d)}catch(e){}}
function nz(d=.2,v=.2){if(!S.on)return;try{const a=ac(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const SFX={click:()=>tn(220,.04,'square',.025),atk:()=>{nz(.12,.25);tn(200,.12,'sawtooth',.08,60)},mag:()=>{tn(300,.4,'sine',.08,900);tn(450,.4,'triangle',.05,1200)},hit:()=>{tn(120,.25,'square',.12,40);nz(.1,.2)},dodge:()=>tn(900,.15,'sine',.05,300),
buy:()=>{tn(700,.08,'triangle');tn(1000,.1,'triangle',.05,1000,.08)},lvl:()=>[400,500,600,800].forEach((f,i)=>tn(f,.2,'triangle',.06,f,i*.1)),boss:()=>{tn(55,1.2,'sawtooth',.15,40);tn(58,1.2,'sawtooth',.15,40)},amb:()=>{tn(90,.8,'sine',.05,50);nz(.5,.05)},win:()=>[500,660,800,1000].forEach((f,i)=>tn(f,.4,'triangle',.07,f,i*.15)),
item:()=>tn(520,.15,'sine',.06),dead:()=>{nz(.9,.5);tn(90,.9,'sawtooth',.2);tn(97,.9,'sawtooth',.2);tn(40,.6,'square',.2,20)}};
const sfx=n=>SFX[n]&&SFX[n]();

// ---------- ILUSTRAÇÕES SVG ----------
const X={
B:()=>[0,1,2,3,4].map(i=>{const h=70+(i*37%60),x=i*85-10;return `<rect x="${x}" y="${196-h}" width="75" height="${h}" fill="#0b0508"/>`+[0,1].map(j=>(i+j)%2?`<rect class="wn" style="animation-delay:${i*.7+j}s" x="${x+14+j*30}" y="${206-h}" width="9" height="13" fill="#e8b45a"/>`:'').join('')}).join(''),

T:()=>[35,345].map(x=>`<path d="M${x} 205 Q${x-12} 140 ${x+5} 80 M${x+5} 80l-30-25M${x+3} 115l32-30M${x} 150l-26-12M${x+5} 80l24-30" stroke="#050304" stroke-width="7" fill="none" stroke-linecap="round"/>`).join('')+'<circle cx="65" cy="150" r="2" fill="#e6d596" class="bl"/><circle cx="73" cy="150" r="2" fill="#e6d596" class="bl"/>',

const back=B('Voltar','m','main');let b='';
if(C.menu==='main')b=`<div class="grid">${B('⚔ Atacar<br><small>habilidades físicas</small>','m','phys')}${B('✦ Magias<br><small>consomem energia</small>','m','mag')}${B('🎒 Itens<br><small>bolsa</small>','m','item')}</div>`;
else if(C.menu==='phys')b=P.phys.map(id=>{const s=SK[id],c=C.cd[id]||0,ok=W().type===s.type;return B(`⚔ ${s.n}<br><small>${TY[s.type]}${s.hits?`, ${s.hits} golpes`:''}${s.cd?`, recarga ${s.cd}`:''}${!ok?`, exige arma ${TY[s.type]}`:''}${c?`, aguarde ${c}`:''}</small>`,'sk',id,'',!ok||c>0)}).join(SP)+SP+back;
else if(C.menu==='mag')b=P.mag.map(id=>{const s=SK[id],m=mult(s.el,e.el);return B(`<span style="color:${EL[s.el].c}">●</span> ${s.n}<br><small>${s.cost} EN${m>1?', vantagem x1,5':m<1?', desvantagem x0,65':''}</small>`,'sk',id,'',P.en<s.cost)}).join(SP)+SP+back;
else b=bag(true)+SP+back;
return h+`<div class="panel">${b}</div>`}
// ---------- LOJAS E LOCAIS ----------
function mkShop(big){const s=[];(big?['grande','pot','ener','furia','po']:['pot','ener','furia','po']).forEach(i=>s.push({t:'i',id:i,p:IT[i].pr}));
const sh=a=>a.sort(()=>Math.random()-.5);
sh(Object.keys(WP).filter(w=>WP[w].pr&&!P.weapons.includes(w)&&(big?WP[w].req>=6:WP[w].req<6))).slice(0,big?2:1).forEach(w=>s.push({t:'w',id:w,p:WP[w].pr}));
sh(Object.keys(SK).filter(k=>SK[k].pr&&!P.phys.includes(k)&&!P.mag.includes(k)&&(big?SK[k].pr>=150:SK[k].pr<150))).slice(0,big?3:2).forEach(k=>s.push({t:'s',id:k,p:SK[k].pr}));
return {big,s,pend:null}}
function vShop(){const g=M.s.map((x,i)=>{const n=x.t==='i'?IT[x.id].n:x.t==='w'?WP[x.id].n:SK[x.id].n,ic=x.t==='i'?IT[x.id].i:x.t==='w'?'🗡️':SK[x.id].k==='phys'?'📜':'🔮';const d=x.t==='i'?IT[x.id].d:x.t==='w'?`${TY[WP[x.id].type]}, ataque ${WP[x.id].atk}, Força ${WP[x.id].req}`:(SK[x.id].k==='phys'?`Físico, ${TY[SK[x.id].type]}`:`Magia de ${EL[SK[x.id].el].n}, ${SK[x.id].cost} EN`);return B(`<span class="card"><span class="ic">${ic}</span><span>${x.sold?'<s>'+n+'</s> <b>VENDIDO</b>':'<b>'+n+'</b>'}<br><small>${d}. 🪙 ${x.p}</small></span></span>`,'buy',i,'',x.sold||P.gold<x.p)}).join(SP);
const sell=Object.keys(P.items).filter(k=>P.items[k]>0).map(k=>B(`Vender ${IT[k].n} x${P.items[k]} <small>🪙 ${IT[k].pr>>1}</small>`,'sell','i:'+k)).concat(P.weapons.filter(w=>WP[w].pr&&w!==P.weapon).map(w=>B(`Vender ${WP[w].n} <small>🪙 ${WP[w].pr>>1}</small>`,'sell','w:'+w))).join(SP);
if(M.pend!==null){const x=M.s[M.pend],L=SK[x.id].k==='phys'?P.phys:P.mag;return `<div class="panel"><h3>Espaço cheio</h3><p>Você só pode ter 4 habilidades dessa categoria. Qual esquecer para aprender ${SK[x.id].n}?</p>${L.map((id,j)=>B(SK[id].n,'rep',j)).join(SP)}${SP}${B('Cancelar','cancel')}</div>`}
return scn('loja','<path d="M170 196L176 120Q200 96 224 120L230 196Z" fill="#000"/><ellipse class="ey" style="color:#f09a3a" cx="194" cy="124" rx="3" ry="2" fill="#f09a3a"/><ellipse class="ey" style="color:#f09a3a" cx="206" cy="124" rx="3" ry="2" fill="#f09a3a"/>')+`<div class="panel"><h2>${M.big?'Mercado Grande':'Mercador'}</h2><p class="dim">${M.big?'Um bazar sob lanternas pálidas, com itens que não se vê em qualquer esquina.':'Uma figura encapuzada abre a capa sobre um monte de frascos e armas.'}</p>${g}</div><div class="panel"><h3>Vender</h3>${sell||'<small>Nada para vender.</small>'}</div>${B('Seguir viagem','leave','','main')}`}
function vInn(){const o=[[.3,15],[.5,28],[1,50]];return scn('inn')+`<div class="panel"><h2>Pousada Velas Mortas</h2><p class="dim">O estalajadeiro não pergunta de onde vem o sangue na sua roupa.</p>${o.map(([r,p])=>{const h=Math.min(hpMax()-P.hp,Math.round(hpMax()*r));return B(`Restaurar ${r*100}% do HP <small>(+${h} HP${r===1?', energia total':''})</small><br><small>🪙 ${p} ouro</small>`,'rest',r+':'+p,'',P.gold<p||P.hp>=hpMax()&&!(r===1&&P.en<enMax()))}).join(SP)}</div>${B('Seguir viagem','leave','','main')}`}
function vDungeon(){const r=D.room;return scn(r===10?'salao':'casa',r===10?'':'',`filter:hue-rotate(${r*22}deg) brightness(${1-r*.04})`)+`<div class="panel"><h2>Casarão Abandonado</h2><small>Sala ${r} de 10</small><div class="pips">${Array.from({length:10},(_,i)=>`<i class="${i<r-1?'on':''}${i==9?' bossp':''}"></i>`).join('')}</div><p>${r===10?'Um brilho de velas derretidas vem da última sala. Há algo grande lá dentro.':pick(['Corredores estreitos, papel de parede descascando e passos que não são os seus.','Um quadro distorcido segue você com os olhos.','Teias grossas cobrem a porta seguinte.'])}</p>${B(r===10?'Abrir a porta das velas':'Abrir a próxima porta','droom','','main')}${SP}${B('Abandonar a masmorra (perde o baú)','leave')}</div>${sheet()}`}
function chest(){const g=70+rnd(50);P.gold+=g;P.items.grande=(P.items.grande||0)+1;let m=`Baú do Tesouro: ${g} ouro e uma Grande Poção.`;
const ks=Object.keys(SK).filter(k=>SK[k].pr>=150&&!P.phys.includes(k)&&!P.mag.includes(k));const k=pick(ks);
if(k){const L=SK[k].k==='phys'?P.phys:P.mag;if(L.length<4){L.push(k);m+=` Você aprende ${SK[k].n}!`}else{P.gold+=60;m+=' (+60 ouro no lugar de uma magia rara)'}}
log(m,'g');G.msg='Você sai do casarão com os bolsos pesados. A névoa lá fora parece mais fria.';view=()=>scn('salao','',"filter:hue-rotate(40deg)")+`<div class="panel"><h2>Madame Blackwood derreteu</h2><p>${m}</p>${B('Sair da masmorra','leave','','main')}</div>`;render()}
function vEnd(){return scn('alva','','','clear')+`<div class="panel"><h1>Jack caiu</h1><p>A névoa escarlate se dissipa e a rua fica em silêncio. ${esc(P.name)} sobreviveu à Área 1.</p><p class="dim">Nível ${P.lvl}, ${G.kills} vitórias, ${P.gold} de ouro. As próximas áreas ainda estão sendo escavadas.</p>${B('Caçar de novo','restart','','main')}</div>`}
// ---------- AÇÕES ----------
const A={
cw:v=>{C0.weapon=v;render()},ce:v=>{C0.el=v;render()},rs:()=>{Object.assign(C0,{vida:1,forca:1,vel:1,energia:1,pts:6});render()},
up:k=>{const T=P||C0;if(T.pts<1)return;T[k]++;T.pts--;if(P){if(k==='vida')P.hp+=12;if(k==='energia')P.en+=6}render()},
dn:k=>{const T=P||C0;if(!canDn(T,k))return;T[k]--;T.pts++;if(P){if(k==='vida')P.hp=Math.min(hpMax(),Math.max(1,P.hp-12));if(k==='energia')P.en=Math.min(enMax(),Math.max(0,P.en-6))}render()},
snd:()=>{S.on=!S.on;try{localStorage.setItem('cdn_snd',S.on?'1':'0')}catch(e){}render()},
go:()=>{const T=C0;P={...T,name:T.name.trim()||'Caçador',weapons:[T.weapon],phys:[WS[T.weapon]],mag:[ELS[T.el]],items:{pot:2,ener:1},gold:30,lvl:1,xp:0,buff:0};P.hp=hpMax();P.en=enMax();commit();
G={adv:0,kills:0,msg:'A névoa escarlate cobre a rua. Cada passo pode ser o último.'};LOG.length=0;log('A caçada começa.');toExplore()},
eq:w=>{if(P.forca>=WP[w].req&&P.phys.some(id=>SK[id].type===WP[w].type)){P.weapon=w;render()}},
ui:id=>useItem(id),m:v=>{C.menu=v;render()},sk:id=>useSkill(id),next:()=>{const f=C.after;C=null;document.documentElement.style.setProperty('--acc','#c0243b');f()},
adv:()=>{commit();G.adv++;if(G.adv>=10){log('Uma figura alta de cartola e máscara de médico da peste surge da névoa...','r');return startCombat(mk(BOSS.jack,1),()=>{view=vEnd;sfx('win');render()})}
const r=rnd(100);
if(r<50){const e=mk(pick(Object.values(E1)),1+(G.adv-1)*.07);startCombat(e,()=>toExplore('A rua volta a ficar quieta. Por enquanto.'))}
else if(r<68){M=mkShop(false);view=vShop;render()}
else if(r<82){D={room:1};log('Você encontra um casarão abandonado.');view=vDungeon;sfx('amb');render()}
else if(r<94){view=vInn;render()}
else{M=mkShop(true);log('Um mercado raro surge entre as barracas.');view=vShop;render()}},
droom:()=>{const r=D.room,e=r===10?mk(BOSS.madame,1):mk(pick(E1D),1+r*.09);startCombat(e,()=>{if(r===10)chest();else{D.room++;view=vDungeon;render()}})},
leave:()=>{toExplore(pick(['Você segue em frente, devagar.','Os lampiões piscam quando você passa.','A névoa fecha atrás de você.']))},
buy:i=>{const x=M.s[i];if(x.sold||P.gold<x.p)return;
if(x.t==='i'){P.gold-=x.p;P.items[x.id]=(P.items[x.id]||0)+1}
else if(x.t==='w'){P.gold-=x.p;P.weapons.push(x.id);x.sold=1}
else{const L=SK[x.id].k==='phys'?P.phys:P.mag;if(L.length>=4){M.pend=i;return render()}P.gold-=x.p;L.push(x.id);x.sold=1}sfx('buy');render()},
rep:j=>{const x=M.s[M.pend];if(P.gold<x.p)return;const L=SK[x.id].k==='phys'?P.phys:P.mag;L[j]=x.id;P.gold-=x.p;x.sold=1;M.pend=null;sfx('buy');render()},cancel:()=>{M.pend=null;render()},
sell:v=>{const[t,id]=v.split(':');if(t==='i'){if(!(P.items[id]>0))return;P.items[id]--;P.gold+=IT[id].pr>>1}else{const i=P.weapons.indexOf(id);if(i<0||id===P.weapon)return;P.weapons.splice(i,1);P.gold+=WP[id].pr>>1}sfx('buy');render()},
rest:v=>{const[r,p]=v.split(':').map(Number);if(P.gold<p)return;P.gold-=p;P.hp=Math.min(hpMax(),P.hp+Math.round(hpMax()*r));if(r===1)P.en=enMax();log('Você descansa ao calor da lareira e se sente melhor.','g');sfx('item');render()},
restart:()=>{$('#scare').classList.remove('on');P=null;C=null;D=null;M=null;C0=newC0();document.documentElement.style.setProperty('--acc','#c0243b');view=vCreate;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){if(S.on)try{ac().resume()}catch(x){}sfx('click');A[b.dataset.a](b.dataset.v)}});
document.addEventListener('input',e=>{if(e.target.id==='nm')C0.name=e.target.value});
$('#em').innerHTML=Array.from({length:10},(_,i)=>`<i class="em" style="left:${i*10+rnd(8)}%;animation-delay:${i*1.1}s"></i>`).join('');
view=vCreate;render();
</script>
